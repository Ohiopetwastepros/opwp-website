name: Production quality gate

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-not-for-production
      ADMIN_SESSION_SECRET: ci-admin-session-secret-not-for-production
      FIELD_AUTH_SECRET: ci-field-auth-secret-not-for-production
      SNG_WEBHOOK_SECRET: ci-sng-secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_fixture
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      TURNSTILE_HOSTNAMES: localhost,127.0.0.1
      SMOKE_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify production messaging flags
        run: node --test tests/production-messaging-flags.test.mjs
      - run: npm ci
      - run: node scripts/prepare-build-inputs.mjs --synthetic
      - run: npm run audit:production
      - run: npm run check:migrations
      - run: npm run audit:routes
      - run: npm test
      - run: npm run test:smoke
      - run: npm run build
      - name: Protected-route and webhook smoke tests
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/opwp-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:http-security
      - run: npm run build:cloudflare
      - run: npm run check:worker-startup
      - name: Production Worker SEO smoke tests
        shell: bash
        env:
          SEO_LOCAL_ORIGIN: https://127.0.0.1:8788
        run: |
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8788 --local-protocol https --infer-origin-from-routes false --show-interactive-dev-session false > /tmp/opwp-seo-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill $worker_pid || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --insecure --fail "$SEO_LOCAL_ORIGIN/" > /dev/null; then break; fi
            sleep 1
          done
          if ! node scripts/seo-http-smoke.mjs; then
            tail -80 /tmp/opwp-seo-worker.log
            exit 1
          fi
      - run: git diff --check
